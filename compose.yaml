# Local PostgreSQL 17 for development and tests.
# Reads DB_PASSWORD from .env (never commit the actual value).
#   docker compose up -d
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: corporate_ai
      POSTGRES_USER: corporate_ai
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - corporate_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corporate_ai -d corporate_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  corporate_pgdata:
