<path d="M455 600 C478 650 488 720 490 800" fill="none" stroke="#3A4596" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

<!-- Blouse and chest -->
<path d="M238 552 L300 700 L362 552 Z" fill="#F7F5FF"/>
<path d="M256 552 L300 636 L344 552 Z" fill="url(#skin)"/>

