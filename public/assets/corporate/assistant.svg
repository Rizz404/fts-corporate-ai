<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="AI assistant">
<title>AI assistant</title>
<defs>
  <linearGradient id="blazer" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2B3475"/>
    <stop offset="1" stop-color="#171D45"/>
  </linearGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4A3030"/>
    <stop offset="1" stop-color="#2A1B1E"/>
  </linearGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F9DAC1"/>
    <stop offset="1" stop-color="#F0C3A2"/>
  </linearGradient>
</defs>

<!-- Back hair -->
<path d="M205 310 C185 200 245 140 300 140 C355 140 415 200 395 310 C425 390 445 490 420 610 L180 610 C155 490 175 390 205 310 Z" fill="url(#hair)"/>

<!-- Torso: blazer -->
